workflows:
  ios-manual-sign:
    name: iOS Manual Code Signing Workflow

    integrations:
      app_store_connect: UAW_API_Key
      
    environment:
      node: 18.16.0
      xcode: latest
      vars:
        BUNDLE_ID: "com.uawauto.uaw"

    scripts:
      - name: Install JS dependencies
        script: |
          set -ex
          npm ci

      - name: Install CocoaPods dependencies
        script: |
          set -ex
          cd ios
          pod install --repo-update

      - name: Set up code signing
        script: |
          set -ex
          keychain initialize
          app-store-connect create-certificate --type IOS_DISTRIBUTION --save
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -ex
          xcode-project build-ipa \
            --workspace ios/UAWauto.xcworkspace \
            --scheme UAWauto

    artifacts:
      - build/ios/*.ipa
      - build/ios/*.plist
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
        beta_groups:
          - UAW-Auto Internal Testing
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL
        copyright: 2025 Bipin Tiwari